name: signatlas

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: signatlas
      POSTGRES_DB: signatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signatlas -d signatlas"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  backend:
    image: signatlas-backend:${VEDICSIGN_IMAGE_TAG:?required}
    build:
      context: .
      target: backend
      args:
        VEDICSIGN_UID: ${VEDICSIGN_UID:-1000}
        VEDICSIGN_GID: ${VEDICSIGN_GID:-1000}
    env_file: [.env.production]
    environment:
      AWS_PROFILE: tapvox-prod
      AWS_SHARED_CREDENTIALS_FILE: /run/signatlas-aws/aws-credentials
      AWS_DEFAULT_REGION: us-west-2
    ports: ["127.0.0.1:18787:8787"]
    volumes:
      - ./.env.production:/app/.env:ro
      - ${SESSION_DATA_DIR:?required}:/app/backend/data/sessions
      - ${SIGNATLAS_AWS_CREDENTIALS_DIR:-/home/ubuntu/signatlas-secrets}:/run/signatlas-aws:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=5).read()"
        ]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 45s
    shm_size: 512mb
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    logging: *logging

  web:
    image: signatlas-web:${VEDICSIGN_IMAGE_TAG:?required}
    build:
      context: .
      target: web-vps
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?required}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?required}
    ports: ["127.0.0.1:18880:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  postgres_data:
