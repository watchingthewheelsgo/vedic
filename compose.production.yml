name: vedicsign

services:
  web:
    image: vedicsign-web:${VEDICSIGN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required}
      labels:
        org.opencontainers.image.revision: ${VEDICSIGN_GIT_SHA:-unknown}
        org.opencontainers.image.created: ${VEDICSIGN_BUILD_TIME:-unknown}
    env_file:
      - ${VEDICSIGN_ENV_FILE:-.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    image: vedicsign-backend:${VEDICSIGN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      args:
        VEDICSIGN_UID: ${VEDICSIGN_UID:-10001}
        VEDICSIGN_GID: ${VEDICSIGN_GID:-10001}
      labels:
        org.opencontainers.image.revision: ${VEDICSIGN_GIT_SHA:-unknown}
        org.opencontainers.image.created: ${VEDICSIGN_BUILD_TIME:-unknown}
    env_file:
      - ${VEDICSIGN_ENV_FILE:-.env.production}
    expose:
      - "8787"
    volumes:
      - ${VEDICSIGN_ENV_FILE:-.env.production}:/app/.env:ro
      - ${SESSION_DATA_DIR:?SESSION_DATA_DIR is required}:/app/backend/data/sessions
    restart: unless-stopped
    stop_grace_period: 45s
    shm_size: "512mb"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=5).read()"
        ]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
