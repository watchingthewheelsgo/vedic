# TLS is installed by certbot after DNS and the HTTP site are verified.
server {
    listen 80;
    server_name signatlas.app www.signatlas.app;
    location / {
        proxy_pass http://127.0.0.1:18880;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 80;
    server_name api.signatlas.app;
    client_max_body_size 10m;
    proxy_read_timeout 600s;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    location = /health { proxy_pass http://127.0.0.1:18787/api/health; }
    location /v1/ { proxy_pass http://127.0.0.1:18787/api/; }
    location = /webhooks/creem { proxy_pass http://127.0.0.1:18787/api/webhooks/creem; }
    location / { return 404; }
}
